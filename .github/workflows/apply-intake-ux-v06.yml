name: Apply Intake UX v0.6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-intake-ux-v06.yml

permissions:
  contents: write

concurrency:
  group: apply-intake-ux-v06
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch project intake
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("geoportal-mvp/components/project-form.jsx")
          text = path.read_text()

          old_import = 'import { TerritoryEditor, createEmptyLocation } from "./territory-editor";'
          new_import = 'import { TerritoryEditor, createEmptyLocation } from "./territory-editor-compact";'
          if old_import not in text and new_import not in text:
              raise SystemExit("Territory editor import not found")
          text = text.replace(old_import, new_import, 1)

          old_click = 'onClick={() => index <= step && setStep(index)}'
          new_click = 'onClick={() => setStep(index)}'
          if old_click in text:
              text = text.replace(old_click, new_click, 1)
          elif new_click not in text:
              raise SystemExit("Stepper click handler not found")

          old_button = '''              <button
                aria-current={index === step ? "step" : undefined}
                onClick={() => setStep(index)}
                type="button"
              >'''
          new_button = '''              <button
                aria-current={index === step ? "step" : undefined}
                aria-label={`Ir a ${item.title}`}
                onClick={() => setStep(index)}
                title={item.description}
                type="button"
              >'''
          if old_button in text:
              text = text.replace(old_button, new_button, 1)
          elif 'aria-label={`Ir a ${item.title}`}' not in text:
              raise SystemExit("Stepper button block not found")

          path.write_text(text)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: geoportal-mvp/package-lock.json

      - name: Install dependencies
        working-directory: geoportal-mvp
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: geoportal-mvp
        run: npm run lint

      - name: Build static export
        working-directory: geoportal-mvp
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /FAO_Cartera_Proyectos
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://xweafcknhbaxpnfeniiq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEPLOYMENT_MODE: operational
        run: npm run build

      - name: Commit upgrade and remove installer
        shell: bash
        run: |
          rm -f .github/workflows/apply-intake-ux-v06.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine project intake navigation and territory capture"
          git push
