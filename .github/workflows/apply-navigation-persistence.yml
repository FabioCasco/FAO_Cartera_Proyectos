# One-time installer; removes itself after a successful verified commit.
name: Apply Navigation Persistence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-navigation-persistence.yml

permissions:
  contents: write

concurrency:
  group: apply-navigation-persistence
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Geoportal state and basemap controls
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("geoportal-mvp/components/geoportal-map.jsx")
          text = path.read_text()

          def require(condition, label):
              if not condition:
                  raise SystemExit(f"Pattern not found: {label}")

          text = text.replace("  ChevronDown,\n", "", 1)

          format_import = 'import { money, percent, statusLabel } from "@/lib/format";\n'
          persistent_import = 'import { usePersistentState } from "@/lib/persistent-state";\n'
          require(format_import in text, "format import")
          if persistent_import not in text:
              text = text.replace(format_import, format_import + persistent_import, 1)

          refs_old = (
              "  const baseLayersRef = useRef(null);\n"
              "  const overlayLayersRef = useRef({});"
          )
          refs_new = (
              "  const baseLayersRef = useRef(null);\n"
              "  const activeBaseLayerRef = useRef(null);\n"
              "  const overlayLayersRef = useRef({});"
          )
          require(refs_old in text or refs_new in text, "basemap refs")
          if refs_new not in text:
              text = text.replace(refs_old, refs_new, 1)

          state_pattern = re.compile(
              r'  const \[area, setArea\] = useState\("all"\);\n'
              r'  const \[project, setProject\] = useState\("all"\);\n'
              r'  const \[query, setQuery\] = useState\(""\);\n'
              r'  const \[analysisMode, setAnalysisMode\] = useState\("municipalities"\);\n'
              r'  const \[summaryTab, setSummaryTab\] = useState\("areas"\);\n'
              r'  const \[selected, setSelected\] = useState\(null\);'
          )
          state_replacement = '''  const [area, setArea] = usePersistentState(
            "fao-hn-geohub:geoportal:v3:area",
            "all",
          );
          const [project, setProject] = usePersistentState(
            "fao-hn-geohub:geoportal:v3:project",
            "all",
          );
          const [query, setQuery] = usePersistentState(
            "fao-hn-geohub:geoportal:v3:query",
            "",
          );
          const [analysisMode, setAnalysisMode] = usePersistentState(
            "fao-hn-geohub:geoportal:v3:analysis-mode",
            "municipalities",
          );
          const [summaryTab, setSummaryTab] = usePersistentState(
            "fao-hn-geohub:geoportal:v3:summary-tab",
            "areas",
          );
          const [basemap, setBasemap] = usePersistentState(
            "fao-hn-geohub:geoportal:v3:basemap",
            "Oscuro · Esri",
          );
          const [mapView, setMapView] = usePersistentState(
            "fao-hn-geohub:geoportal:v3:map-view",
            null,
          );
          const [selected, setSelected] = useState(null);
          const mapViewRef = useRef(mapView);
          const basemapRef = useRef(basemap);

          useEffect(() => {
            mapViewRef.current = mapView;
          }, [mapView]);

          useEffect(() => {
            basemapRef.current = basemap;
          }, [basemap]);'''
          if 'fao-hn-geohub:geoportal:v3:area' not in text:
              text, count = state_pattern.subn(state_replacement, text, count=1)
              require(count == 1, "persistent Geoportal state")

          viewport_old = (
              "        mapRef.current = map;\n"
              "        map.fitBounds(HONDURAS_BOUNDS, { padding: [22, 22] });"
          )
          viewport_new = '''        mapRef.current = map;
                const savedView = mapViewRef.current;
                if (
                  savedView &&
                  Number.isFinite(Number(savedView.latitude)) &&
                  Number.isFinite(Number(savedView.longitude)) &&
                  Number.isFinite(Number(savedView.zoom))
                ) {
                  map.setView(
                    [Number(savedView.latitude), Number(savedView.longitude)],
                    Number(savedView.zoom),
                  );
                } else {
                  map.fitBounds(HONDURAS_BOUNDS, { padding: [22, 22] });
                }'''
          require(viewport_old in text or "const savedView = mapViewRef.current" in text, "restore map viewport")
          if "const savedView = mapViewRef.current" not in text:
              text = text.replace(viewport_old, viewport_new, 1)

          fallback_old = (
              "          mapRef.current.removeLayer(dark);\n"
              "          streets.addTo(mapRef.current);\n"
              "          setMapMessage("
          )
          fallback_new = (
              "          mapRef.current.removeLayer(dark);\n"
              "          streets.addTo(mapRef.current);\n"
              "          activeBaseLayerRef.current = streets;\n"
              "          setBasemap(\"Calles · OpenStreetMap\");\n"
              "          setMapMessage("
          )
          require(fallback_old in text or "activeBaseLayerRef.current = streets" in text, "fallback basemap state")
          if "activeBaseLayerRef.current = streets" not in text:
              text = text.replace(fallback_old, fallback_new, 1)

          initial_old = (
              "        dark.addTo(map);\n"
              "        L.control.scale({ imperial: false, position: \"bottomleft\" }).addTo(map);"
          )
          initial_new = '''        const initialBaseLayer =
                  baseLayersRef.current[basemapRef.current] || dark;
                initialBaseLayer.addTo(map);
                activeBaseLayerRef.current = initialBaseLayer;

                map.on("baselayerchange", (event) => {
                  activeBaseLayerRef.current = event.layer;
                  if (event.name) setBasemap(event.name);
                });

                map.on("moveend", () => {
                  const center = map.getCenter();
                  setMapView({
                    latitude: Number(center.lat.toFixed(6)),
                    longitude: Number(center.lng.toFixed(6)),
                    zoom: Number(map.getZoom().toFixed(2)),
                  });
                });

                L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);'''
          require(initial_old in text or "const initialBaseLayer" in text, "initial basemap listeners")
          if "const initialBaseLayer" not in text:
              text = text.replace(initial_old, initial_new, 1)

          cleanup_old = (
              "      leafletRef.current = null;\n"
              "      baseLayersRef.current = null;\n"
              "    };\n"
              "  }, [retryToken]);"
          )
          cleanup_new = '''      leafletRef.current = null;
              baseLayersRef.current = null;
              activeBaseLayerRef.current = null;
            };
          }, [retryToken]);

          useEffect(() => {
            const map = mapRef.current;
            const baseLayers = baseLayersRef.current;
            if (!map || !mapReady || !baseLayers) return;

            const target = baseLayers[basemap] || baseLayers["Oscuro · Esri"];
            if (!target || activeBaseLayerRef.current === target) return;

            for (const layer of Object.values(baseLayers)) {
              if (map.hasLayer(layer)) map.removeLayer(layer);
            }
            target.addTo(map);
            activeBaseLayerRef.current = target;
          }, [basemap, mapReady]);'''
          require(cleanup_old in text or "const target = baseLayers[basemap]" in text, "basemap switching effect")
          if "const target = baseLayers[basemap]" not in text:
              text = text.replace(cleanup_old, cleanup_new, 1)

          filter_marker = (
              "          </div>\n\n"
              "          <div className=\"geo-analysis-mode\">"
          )
          filter_replacement = '''          <label className="field geo-basemap-field">
                    <span>Mapa base</span>
                    <select
                      onChange={(event) => setBasemap(event.target.value)}
                      value={basemap}
                    >
                      <option value="Oscuro · Esri">Oscuro · predeterminado</option>
                      <option value="Calles · OpenStreetMap">Calles · OpenStreetMap</option>
                      <option value="Topográfico · Esri">Topográfico · Esri</option>
                      <option value="Satélite · Esri">Satélite · Esri</option>
                    </select>
                  </label>
                  <button
                    className="geo-reset-filters"
                    onClick={() => {
                      setArea("all");
                      setProject("all");
                      setQuery("");
                      setAnalysisMode("municipalities");
                      setSummaryTab("areas");
                      setBasemap("Oscuro · Esri");
                      setSelected(null);
                      mapRef.current?.fitBounds(HONDURAS_BOUNDS, {
                        padding: [22, 22],
                      });
                    }}
                    type="button"
                  >
                    Restablecer filtros y mapa
                  </button>
                </div>

                <div className="geo-analysis-mode">'''
          require(filter_marker in text or "geo-basemap-field" in text, "basemap selector")
          if "geo-basemap-field" not in text:
              text = text.replace(filter_marker, filter_replacement, 1)

          if '<div className="map-layer-hint">' in text:
              start = text.index('          <div className="map-layer-hint">')
              end = text.index('          </div>', start) + len('          </div>')
              text = text[:start] + text[end:]

          path.write_text(text)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: geoportal-mvp/package-lock.json

      - name: Install dependencies
        working-directory: geoportal-mvp
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: geoportal-mvp
        run: npm run lint

      - name: Build static export
        working-directory: geoportal-mvp
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /FAO_Cartera_Proyectos
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://xweafcknhbaxpnfeniiq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEPLOYMENT_MODE: operational
        run: npm run build

      - name: Commit changes and remove installer
        shell: bash
        run: |
          rm -f .github/workflows/apply-navigation-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: preserve Geoportal filters, basemap and viewport"
          git push
