name: Apply Operational GeoHub v0.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-operational-v02.yml

permissions:
  contents: write

concurrency:
  group: apply-operational-geohub-v02
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify operational overlay
        shell: bash
        run: |
          cat .upgrade/operational-v02.part.* > /tmp/operational-overlay.b64
          base64 --decode /tmp/operational-overlay.b64 > /tmp/operational-overlay.tar.gz
          echo "edb24b68eff582bad4765c36072c9a7b377498c8be51821bc9337033520f25e1  /tmp/operational-overlay.tar.gz" | sha256sum --check
          tar -xzf /tmp/operational-overlay.tar.gz -C .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: geoportal-mvp/package-lock.json

      - name: Validate Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://xweafcknhbaxpnfeniiq.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is missing"; exit 1; }
          echo "Supabase operational configuration detected."

      - name: Install dependencies
        working-directory: geoportal-mvp
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: geoportal-mvp
        run: npm run lint

      - name: Build static export
        working-directory: geoportal-mvp
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /FAO_Cartera_Proyectos
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://xweafcknhbaxpnfeniiq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEPLOYMENT_MODE: operational
        run: npm run build

      - name: Publish operational source
        shell: bash
        run: |
          rm -rf .upgrade geoportal-mvp/node_modules geoportal-mvp/.next geoportal-mvp/out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were detected."
            exit 0
          fi
          git commit -m "feat: activate authenticated FAO-HN GeoHub v0.2"
          git push
