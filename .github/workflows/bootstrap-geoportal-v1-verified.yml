name: Build, Publish and Deploy Geoportal MVP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bootstrap-geoportal-v1.sh
      - scripts/prepare-github-pages.py
      - .github/workflows/bootstrap-geoportal-v1-verified.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bootstrap-geoportal-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair generator route path
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          generator = Path("bootstrap-geoportal-v1.sh")
          text = generator.read_text()
          bad = "cat > \"$ROOT/app/projects/'[id]'/page.jsx\""
          good = "mkdir -p \"$ROOT/app/projects/[id]\"\ncat > \"$ROOT/app/projects/[id]/page.jsx\""
          if bad not in text:
              raise SystemExit("Expected dynamic route generator line was not found")
          generator.write_text(text.replace(bad, good, 1))
          PY

      - name: Generate application source
        run: bash bootstrap-geoportal-v1.sh geoportal-mvp

      - name: Normalize generated Project 360 layout
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("geoportal-mvp/components/project-360.jsx")
          text = path.read_text()
          old = '  const { id } = useParams(); const [data, setData]'
          new = '  const { id } = useParams();\n  const [data, setData]'
          if old not in text:
              raise SystemExit("Expected Project360 inline state pattern was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Prepare static GitHub Pages application
        run: python scripts/prepare-github-pages.py geoportal-mvp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geoportal-mvp
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: geoportal-mvp
        run: npm run lint

      - name: Build static export
        working-directory: geoportal-mvp
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /FAO_Cartera_Proyectos
          NEXT_PUBLIC_SUPABASE_URL: https://xweafcknhbaxpnfeniiq.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LorAzXKgzKiDX8JykiqKDw_ORqUYyDX
          NEXT_PUBLIC_HONDURAS_ADM2_GEOJSON_URL: https://raw.githubusercontent.com/wmgeolab/geoBoundaries/main/releaseData/gbOpen/HND/ADM2/geoBoundaries-HND-ADM2_simplified.geojson
          NEXT_PUBLIC_DEPLOYMENT_MODE: public-demo

      - name: Add nojekyll marker
        run: touch geoportal-mvp/out/.nojekyll

      - name: Consolidate verified source in main
        run: |
          cp geoportal-mvp/README.md README.md
          cat > START_HERE_GEOportal.md <<'EOF'
          # FAO Honduras · Geoportal de Proyectos

          La aplicación se encuentra en [`geoportal-mvp`](./geoportal-mvp).

          URL esperada: `https://fabiocasco.github.io/FAO_Cartera_Proyectos/`

          La publicación pública consulta Supabase en modo de solo lectura. Las pruebas de alta y actualización se guardan localmente en el navegador hasta incorporar acceso institucional protegido.
          EOF
          rm -rf bootstrap connector-test.txt DEVELOPMENT_STATUS.md
          rm -f bootstrap-geoportal-v1.sh
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/bootstrap-geoportal-v1.yml
          rm -f .github/workflows/bootstrap-geoportal-v1-verified.yml
          rm -f .github/workflows/geoportal-mvp-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish GitHub Pages-ready FAO Honduras Geoportal"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: geoportal-mvp/out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
