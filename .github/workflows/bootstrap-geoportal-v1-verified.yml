name: Build, Publish and Deploy Geoportal MVP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bootstrap-geoportal-v1.sh
      - .github/workflows/bootstrap-geoportal-v1-verified.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bootstrap-geoportal-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair generator route path
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          generator = Path("bootstrap-geoportal-v1.sh")
          text = generator.read_text()
          bad = "cat > \"$ROOT/app/projects/'[id]'/page.jsx\""
          good = "mkdir -p \"$ROOT/app/projects/[id]\"\ncat > \"$ROOT/app/projects/[id]/page.jsx\""
          if bad not in text:
            raise SystemExit("Expected dynamic route generator line was not found")
          generator.write_text(text.replace(bad, good, 1))
          PY

      - name: Generate application source
        run: bash bootstrap-geoportal-v1.sh geoportal-mvp

      - name: Adapt application for GitHub Pages and safe public demo
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path("geoportal-mvp")

          (root / "next.config.mjs").write_text('''/** @type {import("next").NextConfig} */
          const repositoryName = process.env.GITHUB_REPOSITORY?.split("/")[1] || "FAO_Cartera_Proyectos";
          const isGitHubPages = process.env.GITHUB_PAGES === "true";
          const basePath = isGitHubPages ? `/${repositoryName}` : "";

          const nextConfig = {
            reactStrictMode: true,
            poweredByHeader: false,
            output: "export",
            trailingSlash: true,
            basePath,
            assetPrefix: basePath || undefined,
            images: { unoptimized: true },
          };

          export default nextConfig;
          ''')

          # Replace dynamic project links with one static query-string route.
          for path in list(root.rglob("*.js")) + list(root.rglob("*.jsx")):
            text = path.read_text()
            text = text.replace("`/projects/${", "`/project?id=${")
            text = text.replace("'/projects/${", "'/project?id=${")
            text = text.replace('"/projects/${', '"/project?id=${')
            path.write_text(text)

          project_component = root / "components" / "project-360.jsx"
          text = project_component.read_text()
          text = text.replace('import { useParams } from "next/navigation";\n', '')
          text = text.replace('export function Project360() {\n  const { id } = useParams();', 'export function Project360({ id }) {')
          project_component.write_text(text)

          dynamic_route = root / "app" / "projects" / "[id]"
          if dynamic_route.exists():
            for child in dynamic_route.rglob("*"):
              if child.is_file():
                child.unlink()
            for child in sorted(dynamic_route.rglob("*"), reverse=True):
              if child.is_dir():
                child.rmdir()
            dynamic_route.rmdir()

          static_route = root / "app" / "project"
          static_route.mkdir(parents=True, exist_ok=True)
          (static_route / "page.jsx").write_text('''"use client";

          import { Suspense } from "react";
          import Link from "next/link";
          import { useSearchParams } from "next/navigation";
          import { Project360 } from "@/components/project-360";

          function ProjectQueryView() {
            const searchParams = useSearchParams();
            const id = searchParams.get("id");
            if (!id) {
              return <div className="empty-state"><strong>Proyecto no especificado</strong><p>Abra la ficha desde la cartera o el geoportal.</p><Link className="primary-button" href="/projects">Volver a la cartera</Link></div>;
            }
            return <Project360 id={id} />;
          }

          export default function ProjectPage() {
            return <Suspense fallback={<div className="skeleton-panel">Cargando Ficha 360°…</div>}><ProjectQueryView /></Suspense>;
          }
          ''')

          # Prefix the only plain public image with the GitHub Pages base path.
          app_shell = root / "components" / "app-shell.jsx"
          text = app_shell.read_text()
          if "NEXT_PUBLIC_BASE_PATH" not in text:
            text = text.replace("const nav = [", 'const publicBasePath = process.env.NEXT_PUBLIC_BASE_PATH || "";\n\nconst nav = [')
          text = text.replace('src="/geoportal-mark.svg"', 'src={`${publicBasePath}/geoportal-mark.svg`}')
          text = text.replace("Supabase conectado", "Supabase · lectura pública")
          app_shell.write_text(text)

          data_file = root / "lib" / "data.js"
          text = data_file.read_text()
          text = text.replace("if (!sb) {", 'if (!sb || process.env.NEXT_PUBLIC_DEPLOYMENT_MODE === "public-demo") {', 1)
          text = text.replace("if (!sb || !files?.length) return [];", 'if (!sb || !files?.length || process.env.NEXT_PUBLIC_DEPLOYMENT_MODE === "public-demo") return [];')
          text = text.replace("if (!sb) return true;", 'if (!sb || process.env.NEXT_PUBLIC_DEPLOYMENT_MODE === "public-demo") return true;')
          data_file.write_text(text)

          # Fix dashboard ordering expression.
          dashboard = root / "components" / "dashboard.jsx"
          text = dashboard.read_text()
          bad_alerts = '  const alerts = [...data.projects].filter((p) => ["attention", "critical", "closing"].includes(p.status)).sort((a, b) => ({ critical: 0, attention: 1, closing: 2 }[a.status] - ({ critical: 0, attention: 1, closing: 2 }[b.status])).slice(0, 4);'
          good_alerts = '  const alertOrder = { critical: 0, attention: 1, closing: 2 };\n  const alerts = [...data.projects].filter((p) => ["attention", "critical", "closing"].includes(p.status)).sort((a, b) => (alertOrder[a.status] ?? 99) - (alertOrder[b.status] ?? 99)).slice(0, 4);'
          if bad_alerts not in text:
            raise SystemExit("Dashboard alert expression was not found")
          dashboard.write_text(text.replace(bad_alerts, good_alerts, 1))

          # Keep time-derived state pure and initialize update fields on user action.
          project_360 = root / "components" / "project-360.jsx"
          text = project_360.read_text()
          old_data_state = '  const [data, setData] = useState(null); const [tab, setTab] = useState("Resumen"); const [updateOpen, setUpdateOpen] = useState(false); const [saving, setSaving] = useState(false); const [message, setMessage] = useState("");'
          new_data_state = old_data_state + '\n  const [now, setNow] = useState(null);'
          old_fetch = '  useEffect(() => { getProject(id).then(setData); }, [id]);'
          new_fetch = old_fetch + '\n  useEffect(() => { const timer = window.setTimeout(() => setNow(Date.now()), 0); return () => window.clearTimeout(timer); }, []);'
          old_time = '  const timeProgress = useMemo(() => { if (!p) return 0; const start = new Date(p.start_date).getTime(); const end = new Date(p.end_date).getTime(); return Math.max(0, Math.min(100, (Date.now() - start) / (end - start) * 100)); }, [p]);'
          new_time = '  const timeProgress = useMemo(() => { if (!p || !now) return 0; const start = new Date(p.start_date).getTime(); const end = new Date(p.end_date).getTime(); return Math.max(0, Math.min(100, (now - start) / (end - start) * 100)); }, [p, now]);'
          old_form_effect = '  useEffect(() => { if (p) setForm((v) => ({ ...v, expenditure_amount: p.spent || 0, commitments_amount: p.commitments || 0, physical_progress_pct: p.physical_progress_pct || 0, status: p.status || "active" })); }, [p]);\n'
          open_update = '''  function openUpdate() {
            setMessage("");
            setForm((current) => ({
              ...current,
              expenditure_amount: p?.spent || 0,
              commitments_amount: p?.commitments || 0,
              physical_progress_pct: p?.physical_progress_pct || 0,
              status: p?.status || "active",
            }));
            setUpdateOpen(true);
          }
'''
          replacements = [(old_data_state, new_data_state), (old_fetch, new_fetch), (old_time, new_time)]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f"Project 360 pattern not found: {old[:50]}")
            text = text.replace(old, new, 1)
          if old_form_effect not in text:
            raise SystemExit("Project 360 form effect was not found")
          text = text.replace(old_form_effect, open_update, 1)
          text = text.replace('onClick={() => setUpdateOpen(true)}', 'onClick={openUpdate}', 1)
          project_360.write_text(text)

          # Budget is already normalized on submit; remove redundant synchronous effect.
          project_form = root / "components" / "project-form.jsx"
          text = project_form.read_text()
          old_budget_effect = '  useEffect(() => { setFinancial((v) => ({ ...v, budget_amount: Number(project.budget_total || 0) })); }, [project.budget_total]);\n'
          if old_budget_effect not in text:
            raise SystemExit("Project form budget effect was not found")
          project_form.write_text(text.replace(old_budget_effect, '', 1))

          # Keep example variables generic; real public values are injected only by Actions.
          env_example = root / ".env.example"
          if env_example.exists():
            env_example.write_text('''NEXT_PUBLIC_SUPABASE_URL=https://<project-ref>.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_...
          NEXT_PUBLIC_HONDURAS_ADM2_GEOJSON_URL=https://raw.githubusercontent.com/wmgeolab/geoBoundaries/main/releaseData/gbOpen/HND/ADM2/geoBoundaries-HND-ADM2_simplified.geojson
          NEXT_PUBLIC_DEPLOYMENT_MODE=local
          ''')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geoportal-mvp
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: geoportal-mvp
        run: npm run lint

      - name: Build static GitHub Pages export
        working-directory: geoportal-mvp
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /FAO_Cartera_Proyectos
          NEXT_PUBLIC_SUPABASE_URL: https://xweafcknhbaxpnfeniiq.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LorAzXKgzKiDX8JykiqKDw_ORqUYyDX
          NEXT_PUBLIC_HONDURAS_ADM2_GEOJSON_URL: https://raw.githubusercontent.com/wmgeolab/geoBoundaries/main/releaseData/gbOpen/HND/ADM2/geoBoundaries-HND-ADM2_simplified.geojson
          NEXT_PUBLIC_DEPLOYMENT_MODE: public-demo

      - name: Add nojekyll marker
        run: touch geoportal-mvp/out/.nojekyll

      - name: Consolidate verified source in main
        run: |
          cp geoportal-mvp/README.md README.md
          cat > START_HERE_GEOportal.md <<'EOF'
          # FAO Honduras · Geoportal de Proyectos

          La aplicación se encuentra en [`geoportal-mvp`](./geoportal-mvp).

          URL esperada: `https://fabiocasco.github.io/FAO_Cartera_Proyectos/`

          La publicación pública consulta Supabase en modo de solo lectura. Las pruebas de alta y actualización se guardan localmente en el navegador hasta incorporar acceso institucional protegido.
          EOF
          rm -rf bootstrap connector-test.txt DEVELOPMENT_STATUS.md
          rm -f bootstrap-geoportal-v1.sh
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/bootstrap-geoportal-v1.yml
          rm -f .github/workflows/bootstrap-geoportal-v1-verified.yml
          rm -f .github/workflows/geoportal-mvp-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish GitHub Pages-ready FAO Honduras Geoportal"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: geoportal-mvp/out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
