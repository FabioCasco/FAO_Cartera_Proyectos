name: Bootstrap Geoportal MVP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bootstrap-geoportal-v1.sh
      - .github/workflows/bootstrap-geoportal-v1.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-geoportal-v1
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate application tree
        run: bash bootstrap-geoportal-v1.sh geoportal-mvp

      - name: Publish generated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geoportal-mvp START_HERE_GEOportal.md
          if ! git diff --cached --quiet; then
            git commit -m "feat: materialize FAO Honduras geoportal MVP"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: geoportal-mvp/package-lock.json

      - name: Install dependencies
        working-directory: geoportal-mvp
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: geoportal-mvp
        run: npm run lint

      - name: Production build
        working-directory: geoportal-mvp
        run: npm run build
