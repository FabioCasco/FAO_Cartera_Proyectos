name: Bootstrap verified project

on:
  push:
    paths:
      - bootstrap/ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct source archive
        run: |
          cat bootstrap/project.part.* | base64 --decode > /tmp/fao-geoportal.tar.gz
          echo "615c6cd73c8fdf3ebfc45b5c7e8d3fde3c35c03a9aeaa93ba65a5d71843c8fe1  /tmp/fao-geoportal.tar.gz" | sha256sum --check
          tar -xzf /tmp/fao-geoportal.tar.gz -C .
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Consolidate verified source
        run: |
          rm -rf bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add verified FAO Honduras project geoportal MVP"
          git push
