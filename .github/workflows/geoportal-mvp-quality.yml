name: Geoportal MVP Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - geoportal-mvp/**
      - .github/workflows/geoportal-mvp-quality.yml
  push:
    branches: [main]
    paths:
      - geoportal-mvp/**
      - .github/workflows/geoportal-mvp-quality.yml

permissions:
  contents: read

concurrency:
  group: geoportal-mvp-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geoportal-mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: geoportal-mvp/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
