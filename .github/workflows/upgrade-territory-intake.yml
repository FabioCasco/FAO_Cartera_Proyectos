name: Upgrade Project Territory Intake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upgrade-territory-intake.yml
      - scripts/patch_project_form_territory.py

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch project intake
        run: python scripts/patch_project_form_territory.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: geoportal-mvp/package-lock.json

      - name: Install dependencies
        working-directory: geoportal-mvp
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: geoportal-mvp
        run: npm run lint

      - name: Build static export
        working-directory: geoportal-mvp
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /FAO_Cartera_Proyectos
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEPLOYMENT_MODE: operational
        run: npm run build

      - name: Commit upgrade and remove installer
        run: |
          rm -f .github/workflows/upgrade-territory-intake.yml
          rm -f scripts/patch_project_form_territory.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: capture department, municipality and point project coverage"
          git push
